name: Build application

on:
  # Application packaging is manually triggered.
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        required: true
        type: string
      version:
        description: Release tag to embed in the application
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Write build version
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$BUILD_VERSION" ]]; then
            printf '%s\n' "$BUILD_VERSION" > VERSION
          else
            git describe --tags --always > VERSION
          fi

      - name: Build executable
        shell: bash
        run: |
          # PyInstaller uses ';' on Windows and ':' on Unix-like systems for
          # the source:destination separator in --add-data.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            data_separator=';'
          else
            data_separator=':'
          fi

          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --name TransPDF \
            --collect-all gradio \
            --collect-all gradio_client \
            --collect-all safehttpx \
            --collect-all groovy \
            --exclude-module PyQt5 \
            --exclude-module PyQt6 \
            --exclude-module PySide2 \
            --exclude-module PySide6 \
            --add-data "fonts${data_separator}fonts" \
            --add-data "icon.svg${data_separator}." \
            --add-data "VERSION${data_separator}." \
            app.py

      - name: Verify packaged application starts
        run: python scripts/smoke_test_application.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TransPDF-${{ matrix.platform }}
          path: dist/TransPDF
          if-no-files-found: error
          retention-days: 14

      - name: Archive release package
        if: inputs.version != ''
        shell: bash
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ runner.arch }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil

          platform = os.environ["BUILD_PLATFORM"]
          arch = os.environ["BUILD_ARCH"].lower()
          Path("release-assets").mkdir(exist_ok=True)
          archive = shutil.make_archive(
              f"release-assets/TransPDF-{platform}-{arch}",
              "zip" if platform == "windows" else "gztar",
              root_dir="dist",
              base_dir="TransPDF",
          )
          print(archive)
          PY

      - name: Upload release package
        if: inputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
