name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v1.0.0)
        required: true
        type: string
      prerelease:
        description: Mark this as a pre-release
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v1.0.0 or v1.0.0-rc.1" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          # The workflow may start from a branch ref, so explicitly fetch the
          # requested tag before resolving its commit.
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          sha=$(git rev-parse --verify "$RELEASE_TAG^{commit}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  tests:
    needs: prepare
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  build:
    needs: tests
    uses: ./.github/workflows/build-application.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ inputs.tag }}

  docker:
    needs: tests
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ inputs.tag }}

  publish:
    needs: [prepare, tests, build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Generate checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          assets = Path("release-assets")
          packages = sorted([*assets.glob("*.zip"), *assets.glob("*.tar.gz")])
          if len(packages) != 3:
              raise RuntimeError(f"Expected 3 platform packages, found {len(packages)}")
          with (assets / "SHA256SUMS.txt").open("w", encoding="utf-8") as output:
              for package in packages:
                  with package.open("rb") as source:
                      digest = hashlib.file_digest(source, "sha256").hexdigest()
                  output.write(f"{digest}  {package.name}\n")
          PY

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # Refuse to publish if the tag moved while the binaries were building.
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse --verify "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
